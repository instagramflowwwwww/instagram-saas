name: Process Instagram Queue

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/process-instagram-queue.yml"
      - "app/api/cron/process-queue/route.ts"
      - "app/api/queue/process/route.ts"
      - "lib/queue-processor.ts"
      - "app/dashboard/layout.tsx"

concurrency:
  group: instagram-publishing-queue
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate configuration
        env:
          APP_URL: ${{ secrets.APP_URL }}
          QUEUE_CRON_SECRET: ${{ secrets.QUEUE_CRON_SECRET }}
        run: |
          test -n "$APP_URL" || (echo "APP_URL secret is missing" && exit 1)
          test -n "$QUEUE_CRON_SECRET" || (echo "QUEUE_CRON_SECRET secret is missing" && exit 1)
          case "$APP_URL" in
            https://*) ;;
            *) echo "APP_URL must start with https://" && exit 1 ;;
          esac

      - name: Process due Instagram posts
        env:
          APP_URL: ${{ secrets.APP_URL }}
          QUEUE_CRON_SECRET: ${{ secrets.QUEUE_CRON_SECRET }}
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint="${APP_URL%/}/api/cron/process-queue"

          for cycle in 1 2 3 4 5 6; do
            body_file="$(mktemp)"
            http_code="$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 20 \
              --max-time 320 \
              --retry 2 \
              --retry-all-errors \
              --request POST \
              --header "Authorization: Bearer $QUEUE_CRON_SECRET" \
              --header "Content-Type: application/json" \
              --output "$body_file" \
              --write-out "%{http_code}" \
              "$endpoint")"

            echo "Cycle $cycle returned HTTP $http_code"
            cat "$body_file"
            echo

            if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
              rm -f "$body_file"
              exit 1
            fi

            due="$(node -e '
              const fs = require("fs");
              const payload = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.stdout.write(String(Number(payload.due || 0)));
            ' "$body_file")"
            rm -f "$body_file"

            if [[ "$due" -eq 0 ]]; then
              echo "No due items remain."
              break
            fi

            sleep 2
          done
