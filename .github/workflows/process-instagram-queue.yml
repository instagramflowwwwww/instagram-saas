name: Process Instagram Queue

on:
  workflow_dispatch:

concurrency:
  group: instagram-publishing-queue
  cancel-in-progress: false

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate configuration
        env:
          APP_URL: ${{ secrets.APP_URL }}
          QUEUE_CRON_SECRET: ${{ secrets.QUEUE_CRON_SECRET }}
        run: |
          test -n "$APP_URL" || (echo "APP_URL secret is missing" && exit 1)
          test -n "$QUEUE_CRON_SECRET" || (echo "QUEUE_CRON_SECRET secret is missing" && exit 1)
          case "$APP_URL" in
            https://*) ;;
            *) echo "APP_URL must start with https://" && exit 1 ;;
          esac

      - name: Process one queue chunk
        env:
          APP_URL: ${{ secrets.APP_URL }}
          QUEUE_CRON_SECRET: ${{ secrets.QUEUE_CRON_SECRET }}
        shell: bash
        run: |
          set -Eeuo pipefail
          endpoint="${APP_URL%/}/api/cron/process-queue"
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          http_code="$(curl \
            --silent \
            --show-error \
            --location \
            --connect-timeout 10 \
            --max-time 110 \
            --request POST \
            --header "Authorization: Bearer $QUEUE_CRON_SECRET" \
            --header "Content-Type: application/json" \
            --output "$body_file" \
            --write-out "%{http_code}" \
            "$endpoint")"

          echo "Queue chunk returned HTTP $http_code"
          cat "$body_file"
          echo

          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            exit 1
          fi

          echo "Manual backup queue chunk finished."
